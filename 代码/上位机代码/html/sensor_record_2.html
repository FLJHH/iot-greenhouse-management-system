<!DOCTYPE html>
<html>

<style>
	[v-cloak] {
		display: none;
	}
</style>


<head>
	<meta charset="utf-8">
	<meta id="viewport" name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,
		minimum-scale=1.0,user-scalable=no,viewport-fit=cover">

	<!-- <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css"> -->
	<link rel="stylesheet" href="../js/element-ui/theme-chalk/index.css">
	<!-- <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css"> -->




</head>

<body>

	<div id="container" class="container" v-cloak>



		<el-card class="box-card" style="margin-bottom: 20px;margin-left: 60px;">

			<el-row>
				<el-col :span="12" :xs="24">
					<el-button type="primary" icon="el-icon-download" @click="download_history(item)"
						style="margin: 10px;">导出历史数据</el-button>
				</el-col>
				<el-col :span="12" :xs="24">
					<el-button type="danger" icon="el-icon-delete" @click="clean_history(item)" style="margin: 10px;">
						清空历史数据</el-button>
				</el-col>
			</el-row>

		</el-card>


		
		<div class="block">
			<el-timeline>
				<template v-for="(item, index) of slist">
					<el-timeline-item :timestamp="item.time" placement="top">
						<el-card>
							<h4>名称：{{item.sensor_name}}</h4>
							<p>数值：{{item.sensor_value}}</p>
							<p>{{item.time}}</p>
						</el-card>
					</el-timeline-item>
				</template>

			</el-timeline>
		</div>

		 
	</div>

</body>








<script src="../js/project_config.js"></script>
 
<!-- <script src="https://unpkg.com/element-ui/lib/index.js"></script> -->

<script src="../js/vue.js"></script>
<script src="../js/element-ui/index.js"></script>
<script src="../js/jquery-3.4.1.min.js"></script>

 <!-- import Vue before Element -->
 <!-- <script src="https://unpkg.com/vue@2/dist/vue.js"></script> -->
 <!-- import JavaScript -->
 <!-- <script src="https://unpkg.com/element-ui/lib/index.js"></script> -->



<script>




	function request_option(option, data, callback) {

		var final_url = cfg_sensor_record_url;
		final_url = final_url + "?option=" + option + "&data=" + JSON.stringify(data);

		console.log(final_url);

		$.ajax({
			type: 'get',
			dataType: "json",
			url: final_url,
			success: function (data) {
				var json_data;
				try {
					json_data = JSON.parse(data);
				} catch (error) {
					json_data = data;
				}
				callback(json_data);
			},
		});
	}




	var app = new Vue({
		el: '#container',
		data: {
			isActive: false, // 是否显示弹窗
			isAddNew: true, //是否是添加数据
			selected: -1, // 选择了哪条记录
			selectedlist: {}, // 选中的信息
			slist: [], //add default value here
			searchlist: [],
			list: []
		},


		created() {

			// this.setSlist(this.list);

			var _self = this;

			request_option("history", null, function (data) {
				_self.list = data;

				console.log(JSON.stringify(data));

				_self.setSlist(_self.list);
			});

			this.$message({
				message: '数据加载中...',
				center: true,
				type: 'success'
			});


		},
		methods: {

			// 修改数据
			showOverlay(item) {

				this.selectedlist = item;
				this.changeOverlay();

				this.isAddNew = false;

			},
			// 点击保存按钮
			modify(value) {

				_self = this;

				console.log(JSON.stringify(value));

				if (this.isAddNew) {
					console.log("option is  insert");
					request_option("insert", value, function (data) {

						request_option("select", " ", function (data) {
							console.log(JSON.stringify(data));


							_self.list = data;


							_self.setSlist(data);
							_self.changeOverlay();
						});

					});
				} else {
					console.log("option is  update");

					request_option("update", value, function (data) {

						request_option("select", " ", function (data) {
							console.log(JSON.stringify(data));

							_self.list = data;


							_self.setSlist(data);
							_self.changeOverlay();
						});

					});

				}
			},

			add: function () {

				this.selectedlist = this.slist[0];

				for (var value in this.selectedlist) {
					this.selectedlist[value] = '';
				}

				this.selected = -1;
				this.isAddNew = true;
				this.isActive = true;
			},
			// delete list in index location

			del(item) {

				console.log(item);

				if (this.slist.length < 2) {
					return;
				}

				_self = this;

				request_option("delete", item, function (data) {
					// _self.resource = data;

					console.log(JSON.stringify(data));

					_self.list = data;


					_self.setSlist(data);

				});
			},

			changeOverlay() {
				this.isActive = !this.isActive;
			},

			// 获取需要渲染到页面中的数据
			setSlist(arr) {
				this.slist = JSON.parse(JSON.stringify(arr));
			},

			// 搜索
			search(e) {
				var v = e.target.value,
					self = this;

				self.searchlist = [];

				if (v) {
					var ss = [];
					// 过滤需要的数据
					this.list.forEach(function (item) {

						for (var value in item) {
							if (value != null && item[value] != null) {
								var search_string = item[value] + "";
								if (search_string != null && search_string.indexOf(v) > -1) {
									if (self.searchlist.indexOf(search_string) == -1) {
										self.searchlist.push(search_string);
									}
									ss.push(item);
								}
							}

						}
					});

					this.setSlist(ss); // 将过滤后的数据给了slist
				} else {
					// 没有搜索内容，则展示全部数据
					this.setSlist(this.list);
				}
			},
			clean_history(item) {

				_self = this;

				request_option("clean", null, function (data) {
					_self.list = data;

					console.log(JSON.stringify(data));

					_self.setSlist(_self.list);
				});

			},
			download_history(item) {

				var file_name = '历史数据';
				var myDate = new Date();
				var mytime = myDate.toLocaleTimeString();     //获取当前时间

				file_name = file_name + '_' + mytime;

				JSONToExcelConvertor(this.list, file_name);

				this.$alert('数据导出完成,请查看[ ' + file_name + '.xls ]', '提示', {
					confirmButtonText: '确认'
				});

			}
		},
		watch: {}
	});
</script>

</html>
