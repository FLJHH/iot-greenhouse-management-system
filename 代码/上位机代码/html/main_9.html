<!DOCTYPE html>
<html>

<style>
	[v-cloak] {
		display: none;
	}
</style>

<style>


</style>

<head>
	<meta charset="UTF-8">

	<!-- 引入 Element UI 的 CSS -->
	<link rel="stylesheet" href="../js/element-ui/theme-chalk/index.css">
	<!-- 引入 Font Awesome 4.7.0 的 CSS -->
	<link rel="stylesheet" href="../css/font-awesome-4.7.0/css/font-awesome.min.css">

	<!-- 设置视口宽度，初始缩放比例，最小缩放比例，最大缩放比例，用户缩放 -->
	<meta name="viewport"
		content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />


</head>




<body style="background-color: rgb(238, 241, 246)">
<!-- 这段HTML代码是用于构建一个基于Vue.js的单页应用（SPA）的用户界面。它包含了导航栏、页面组件和用户登录信息等 -->
	<div id="app" v-cloak>
		<el-container>

			<el-row style="position:absolute;margin-top: 20px;margin-left: 20px; ">
				<el-button type="success" icon="el-icon-plus" circle id="header_title_button" @click="show_header()"
					style="display: none;">
				</el-button>
			</el-row>


			<el-header style="height:130px;padding-bottom: 10px;" id="header_title">
				<el-menu class="el-menu-vertical-demo" background-color="#994748" text-color="#fff"
					active-text-color="#ffd04b" mode="horizontal">

					<el-menu-item v-for="(item, index_num) of router_table" v-bind:key="index_num"
						v-if="check_router_permission(item)" :index='item.id' @click="change_page(item)">
						<span v-html='item.icon'></span> &nbsp;
						{{item.name}}
					</el-menu-item>

					<el-menu-item index="1001-2" style="float: right;" @click="logout('退出登录')"><i
							class="el-icon-help"></i>{{config_data.user_name}}&nbsp; &nbsp; 退出登录
					</el-menu-item>

				</el-menu>

			</el-header>

			<el-container>



				<el-main style="margin: 0px 0px;padding: 0px 0px;">




					<el-row>

						<el-col :span="24" :xs="24" style="text-align: center;"
							v-if="config_data.ui_cfg_pc_main_component_1=='clock'">
							<iframe src="../app/clock_fliper/index.html" id="app_component_1" width="600px"
								height="125px" frameborder="0"
								style="margin:0px;margin: 0 auto;display: block;"></iframe>
						</el-col>

						<el-col :span="24" :xs="24">
							<iframe id="iframe_main" width="100%" height="100%" frameborder="0"
								style="margin:0px;"></iframe>
						</el-col>


						<iframe src="../app/3D-demo/3Dtag.html" id="app_component_2" width="280px" height="450px"
							v-if="config_data.ui_cfg_pc_main_component_2=='tag'" frameborder="0"
							style="position:absolute;right:0px;bottom:0px;"></iframe>

						<iframe src="../app/3D-demo/3Dcube.html" id="app_component_2" width="280px" height="450px"
							v-if="config_data.ui_cfg_pc_main_component_2=='cube'" frameborder="0"
							style="position:absolute;right:0px;bottom:0px;"></iframe>


					</el-row>



				</el-main>
			</el-container>

		</el-container>
	</div>



</body>


<script src="../js/project_config.js"></script>

<script src="../js/vue.js"></script>
<script src="../js/element-ui/index.js"></script>
<script src="../js/jquery-3.4.1.min.js"></script>
<script src="../js/db_table.js"></script>



<script>
	var iframe = document.getElementById("iframe_main");
	iframe.height = document.documentElement.clientHeight * 0.90;

	window.onresize = function () {
		var iframe = document.getElementById("iframe_main");
		iframe.height = document.documentElement.clientHeight * 0.90;

	}


	var app = new Vue({
		el: '#app',
		data: {
			list: [],
			config_data: {

			},
			role_table: [],
			router_table: [],
			position: '账户管理',
			isDisplay_listItem: false, //是否显示侧边栏
		},

		created() {



			// console.log('project_data:' + project_data);

			this.config_data = JSON.parse(project_data);

			console.log(JSON.stringify(this.config_data));

			if (this.config_data == null || this.config_data == '') {
				this.$alert('物联网云平台：请先登录！', {
					confirmButtonText: '确定',
					callback: action => {
						localStorage.setItem("project_data", null); //clean config data
						window.location.replace("login.html"); //登录成功就跳转到传感器监测页面
					}
				});
			}



			this.check_timeout();


			var _this = this;

			db_table_ops("get", "role", "select", "{}", function (data) {
				_this.role_table = data;
				console.log(JSON.stringify(_this.role_table));
			});

			db_table_ops("get", "router", "select", "{}", function (data) {
				//按照index排序
				var temp_value = data;
				temp_value.sort(function (a, b) {

					var index_a = 100000;
					var index_b = 100000;
					if (a.index != '' && a.index != null) {
						index_a = parseInt(a.index);
					}

					if (b.index != '' && b.index != null) {
						index_b = parseInt(b.index);
					}

					return (index_a - index_b);
				});

				_this.router_table = temp_value;

			});


			//-----------------------启动分析引擎---------------------------//
			_self = this;
			var upload_data = {
				id: "main"
			};
			db_table_ops('get', 'analyze', 'get', upload_data, function (data) {

				if (data == null || data.value == undefined || data.value == null || data.value == '') {
					console.log("规则引擎获取失败!");
					return;
				}

				_self.analyze_script = data.value;
				console.log(data.value);

				try {
					var analyze_function = new Function('context', 'data', data.value);
					analyze_function(_self, {});
				} catch (error) {
					this.$message({
						message: "规则引擎解析失败:" + error,
						type: 'warning',
						duration: 1800,
						dangerouslyUseHTMLString: true
					});

					console.log("规则引擎解析失败:\n" + error)
				}

			});
			//------------------------------------------------------------//

			setTimeout(_self.load_default_page, 300);


		},
		methods: {
			load_default_page() {
				for (let item of this.router_table) {
					if (this.check_router_permission(item)) {
						this.change_page(item);
						console.log(JSON.stringify(item));
						break;
					}
				}
			},
			check_router_permission(item_router) {

				if (this.config_data == null || this.config_data == '') {
					return false;
				}

				if (item_router.enable == 'true' && item_router.type == 'pc') {

					for (let item_role of this.role_table) {

						if (item_role.role == this.config_data.user_role) {
							if (item_role.permission.trim().indexOf(item_router.id.trim()) != -1) {

								return true;
							}
						}
					}

				}
				return false;
			},
			change_page(item) {

				var local_patch = item.url;
				document.getElementById('iframe_main').src = local_patch;


				this.position = item.name;

				console.log("local_patch=" + local_patch);
			},
			logout() {
				window.location.replace("./index.html"); //跳转到登录页面
			},
			check_timeout() {

				var _self = this;

				$.ajax({
					type: 'get',
					dataType: "json",
					url: cfg_check_timout_url,
					success: function (data) {
						var json_data;
						try {
							json_data = JSON.parse(data);
						} catch (error) {
							json_data = data;
						}

						if (json_data.value == "disable") {
							//return;
						} else {
							_self.$notify({
								title: '提示',
								message: '设计测试到期时间：' + json_data.value,
								duration: 0,
							});
						}
					},
				});
			}

		},
		watch: {}
	});
</script>




</html>
